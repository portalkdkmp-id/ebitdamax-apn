apiVersion: batch/v1
kind: Job
metadata:
  name: ebitda-migrate-IMAGE_TAG
  namespace: ebitda
  labels:
    app.kubernetes.io/name: ebitdamax-apn
    app.kubernetes.io/component: migration
    app.kubernetes.io/version: IMAGE_TAG
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebitdamax-apn
        app.kubernetes.io/component: migration
        app.kubernetes.io/version: IMAGE_TAG
    spec:
      serviceAccountName: ebitda
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: APP_IMAGE
          imagePullPolicy: IfNotPresent
          args:
            - php
            - artisan
            - migrate
            - --force
            - --no-interaction
          envFrom:
            - configMapRef:
                name: ebitda-config
            - secretRef:
                name: ebitda-secret
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
            limits:
              cpu: '1'
              memory: '1Gi'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: redis-ca
              mountPath: /etc/ssl/redis
              readOnly: true
      volumes:
        - name: redis-ca
          configMap:
            name: ebitda-redis-ca
