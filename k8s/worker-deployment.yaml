apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebitda-worker
  namespace: ebitda
  labels:
    app.kubernetes.io/name: ebitda
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ebitda
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebitda
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: ebitda
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: asia-southeast2-docker.pkg.dev/portal-kdmp/company-prod/ebitda:<GIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - php
          args:
            - artisan
            - queue:work
            - redis
            - --sleep=3
            - --tries=3
            - --timeout=90
            - --no-interaction
          envFrom:
            - configMapRef:
                name: ebitda-config
            - secretRef:
                name: ebitda-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
