apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebitda
  namespace: ebitda
  labels:
    app.kubernetes.io/name: ebitda
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ebitda
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebitda
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: ebitda
      terminationGracePeriodSeconds: 60
      containers:
        - name: ebitda
          image: asia-southeast2-docker.pkg.dev/portal-kdmp/company-prod/ebitda:<GIT_SHA>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ebitda-config
            - secretRef:
                name: ebitda-secret
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
