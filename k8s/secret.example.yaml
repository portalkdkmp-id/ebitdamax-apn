apiVersion: v1
kind: Secret
metadata:
  name: ebitda-secret
  namespace: ebitda
  labels:
    app.kubernetes.io/name: ebitdamax-apn
type: Opaque
stringData:
  # Example keys only. Copy this file outside the repository, replace every
  # value, and apply it securely. Never commit the populated Secret.
  APP_KEY: '<run: php artisan key:generate --show>'
  DB_HOST: '<external-postgresql-host>'
  DB_USERNAME: '<postgresql-username>'
  DB_PASSWORD: '<postgresql-password>'
  REDIS_HOST: '<external-redis-host>'
  REDIS_USERNAME: '<redis-username-or-empty>'
  REDIS_PASSWORD: '<redis-password>'
  PORTAL_PEMBANGUNAN_SARPRAS_TOKEN: '<portal-token>'
  LARK_APP_ID: '<lark-app-id>'
  LARK_APP_SECRET: '<lark-app-secret>'
