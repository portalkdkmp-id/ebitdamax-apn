apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebitda
  namespace: ebitda
  labels:
    app.kubernetes.io/name: ebitda
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ebitda
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebitda
        app.kubernetes.io/component: web
      annotations:
        gke-gcsfuse/volumes: 'true'
    spec:
      serviceAccountName: ebitda
      nodeSelector:
        workload: app
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: APP_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ebitda-config
            - secretRef:
                name: ebitda-secret
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '1'
              memory: '1Gi'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/storage/app/private
            - name: redis-ca
              mountPath: /etc/ssl/redis
              readOnly: true
      volumes:
        - name: redis-ca
          configMap:
            name: ebitda-redis-ca
        - name: uploads
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: false
            volumeAttributes:
              bucketName: dev-agrinas-apn-prod-ebitda-assets
              mountOptions: 'implicit-dirs'
