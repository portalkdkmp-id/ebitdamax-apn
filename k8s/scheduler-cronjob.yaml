apiVersion: batch/v1
kind: CronJob
metadata:
  name: ebitda-scheduler
  namespace: ebitda
  labels:
    app.kubernetes.io/name: ebitda
    app.kubernetes.io/component: scheduler
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ebitda
            app.kubernetes.io/component: scheduler
        spec:
          serviceAccountName: ebitda
          restartPolicy: OnFailure
          containers:
            - name: scheduler
              image: asia-southeast2-docker.pkg.dev/portal-kdmp/company-prod/ebitda:<GIT_SHA>
              imagePullPolicy: IfNotPresent
              command:
                - php
              args:
                - artisan
                - schedule:run
                - --no-interaction
              envFrom:
                - configMapRef:
                    name: ebitda-config
                - secretRef:
                    name: ebitda-secret
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
