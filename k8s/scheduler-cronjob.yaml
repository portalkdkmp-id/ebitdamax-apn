apiVersion: batch/v1
kind: CronJob
metadata:
  name: ebitda-scheduler
  namespace: ebitda
  labels:
    app.kubernetes.io/name: ebitdamax-apn
    app.kubernetes.io/component: scheduler
spec:
  schedule: '* * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ebitdamax-apn
            app.kubernetes.io/component: scheduler
        spec:
          serviceAccountName: ebitda
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scheduler
              image: APP_IMAGE
              imagePullPolicy: IfNotPresent
              args:
                - php
                - artisan
                - schedule:run
                - --no-interaction
              envFrom:
                - configMapRef:
                    name: ebitda-config
                - secretRef:
                    name: ebitda-secret
              resources:
                requests:
                  cpu: '50m'
                  memory: '128Mi'
                limits:
                  cpu: '500m'
                  memory: '512Mi'
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
