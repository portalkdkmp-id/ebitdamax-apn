name: Deploy to GKE

on:
  workflow_dispatch:

concurrency:
  group: ebitdamax-apn-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GAR_LOCATION: asia-southeast2
  GAR_REPOSITORY: company-docker
  IMAGE_NAME: ebitdamax-apn
  K8S_NAMESPACE: ebitda

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://ebitdamax-prod.dev-agrinas.id

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=7 HEAD)"
          image_uri="${GAR_LOCATION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${GAR_REPOSITORY}/${IMAGE_NAME}:${short_sha}"
          echo "tag=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "uri=${image_uri}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud and GKE auth plugin
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker for Artifact Registry
        shell: bash
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          build-args: |
            APP_VERSION=${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get GKE credentials
        shell: bash
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: 'True'
        run: |
          gcloud container clusters get-credentials "${{ vars.GKE_CLUSTER }}" \
            --location "${{ vars.GKE_LOCATION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}"

      - name: Create namespace and base resources
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/serviceaccount.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/service.yaml

          if ! kubectl get clusterissuer letsencrypt-prod >/dev/null 2>&1; then
            kubectl apply -f k8s/clusterissuer-letsencrypt-prod.yaml
          fi

          kubectl apply -f k8s/ingress.yaml

      - name: Validate application Secret
        shell: bash
        run: |
          set -euo pipefail
          secret_name="ebitda-secret"
          kubectl get secret "$secret_name" --namespace "$K8S_NAMESPACE" >/dev/null

          required_keys=(
            APP_KEY DB_HOST DB_USERNAME DB_PASSWORD
            REDIS_HOST REDIS_PASSWORD
            PORTAL_PEMBANGUNAN_SARPRAS_TOKEN
            LARK_APP_ID LARK_APP_SECRET
          )

          for key in "${required_keys[@]}"; do
            value="$(kubectl get secret "$secret_name" --namespace "$K8S_NAMESPACE" \
              --output="jsonpath={.data.${key}}")"
            if [ -z "$value" ]; then
              echo "Secret $secret_name is missing a non-empty $key key." >&2
              exit 1
            fi
          done

      - name: Render Kubernetes workloads
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ebitda-k8s"

          for manifest in deployment worker-deployment scheduler-cronjob migration-job; do
            sed \
              -e "s|APP_IMAGE|${IMAGE_URI}|g" \
              -e "s|IMAGE_TAG|${IMAGE_TAG}|g" \
              "k8s/${manifest}.yaml" > "$RUNNER_TEMP/ebitda-k8s/${manifest}.yaml"
          done

      - name: Run database migration
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          job_name="ebitda-migrate-${IMAGE_TAG}"
          manifest="$RUNNER_TEMP/ebitda-k8s/migration-job.yaml"

          kubectl delete job "$job_name" --namespace "$K8S_NAMESPACE" --ignore-not-found
          kubectl apply -f "$manifest"

          completed=false
          for _ in $(seq 1 120); do
            if [ "$(kubectl get job "$job_name" --namespace "$K8S_NAMESPACE" \
              --output='jsonpath={.status.conditions[?(@.type=="Complete")].status}')" = "True" ]; then
              completed=true
              break
            fi

            if [ "$(kubectl get job "$job_name" --namespace "$K8S_NAMESPACE" \
              --output='jsonpath={.status.conditions[?(@.type=="Failed")].status}')" = "True" ]; then
              break
            fi

            sleep 5
          done

          if [ "$completed" != true ]; then
            echo "Migration failed or timed out. Diagnostics follow." >&2
            kubectl describe job "$job_name" --namespace "$K8S_NAMESPACE" || true
            kubectl get pods --namespace "$K8S_NAMESPACE" \
              --selector="job-name=${job_name}" --output=wide || true
            kubectl logs "job/${job_name}" --namespace "$K8S_NAMESPACE" \
              --all-containers=true --tail=-1 || true
            exit 1
          fi

          kubectl logs "job/${job_name}" --namespace "$K8S_NAMESPACE" \
            --all-containers=true --tail=-1

      - name: Deploy application workloads
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f "$RUNNER_TEMP/ebitda-k8s/deployment.yaml"
          kubectl apply -f "$RUNNER_TEMP/ebitda-k8s/worker-deployment.yaml"
          kubectl apply -f "$RUNNER_TEMP/ebitda-k8s/scheduler-cronjob.yaml"
          kubectl apply -f k8s/hpa.yaml

      - name: Wait for rollouts
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/ebitda \
            --namespace "$K8S_NAMESPACE" --timeout=10m
          kubectl rollout status deployment/ebitda-worker \
            --namespace "$K8S_NAMESPACE" --timeout=10m
          kubectl get pods,service,ingress,hpa \
            --namespace "$K8S_NAMESPACE" --output=wide

      - name: Show workload diagnostics on failure
        if: failure()
        shell: bash
        run: |
          kubectl get all --namespace "$K8S_NAMESPACE" --output=wide || true
          kubectl get events --namespace "$K8S_NAMESPACE" \
            --sort-by='.lastTimestamp' | tail -n 80 || true
          kubectl describe deployment/ebitda \
            --namespace "$K8S_NAMESPACE" || true
          kubectl describe deployment/ebitda-worker \
            --namespace "$K8S_NAMESPACE" || true
          kubectl logs deployment/ebitda --namespace "$K8S_NAMESPACE" \
            --all-containers=true --tail=200 || true
          kubectl logs deployment/ebitda-worker --namespace "$K8S_NAMESPACE" \
            --all-containers=true --tail=200 || true
